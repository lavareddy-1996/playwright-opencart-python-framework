name: Playwright CI Pipeline

####################################################
# Workflow Triggers
####################################################
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

####################################################
# Permissions
####################################################
permissions:
  contents: read

####################################################
# Global Environment Variables
####################################################
env:
  BASE_URL: https://tutorialsninja.com/demo/

####################################################
# Jobs
####################################################
jobs:
  automation-tests:

    name: >
      ${{ matrix.os }} |
      Python ${{ matrix.python-version }} |
      ${{ matrix.browser }}

    runs-on: ${{ matrix.os }}

    timeout-minutes: 30

    ##################################################
    # Matrix Strategy
    ##################################################
    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest

        python-version:
          - "3.10"
          - "3.11"

        browser:
          - chromium

    ##################################################
    # Steps
    ##################################################
    steps:

      ##################################################
      # Checkout Repository
      ##################################################
      - name: Checkout Repository
        uses: actions/checkout@v4

      ##################################################
      # Setup Python
      ##################################################
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      ##################################################
      # Upgrade pip
      ##################################################
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      ##################################################
      # Install Dependencies
      ##################################################
      - name: Install Dependencies
        run: python -m pip install -r requirements.txt

      ##################################################
      # Cache Playwright Browsers
      ##################################################
      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      ##################################################
      # Install Playwright Browsers
      ##################################################
      - name: Install Playwright Browsers
        run: python -m playwright install

      ##################################################
      # Execute Tests
      ##################################################
      - name: Execute Playwright Tests
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          BASE_URL: ${{ env.BASE_URL }}

        run: |
          python -m pytest tests/test_login.py \
          --pw-browser=${{ matrix.browser }}

      ##################################################
      # Upload HTML Report
      ##################################################
      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: html-report-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.browser }}
          path: reports/myreport.html
          retention-days: 7
          if-no-files-found: warn

      ##################################################
      # Upload Allure Results
      ##################################################
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: allure-results-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.browser }}
          path: reports/allure-results
          retention-days: 7
          if-no-files-found: warn

      ##################################################
      # Upload Test Results
      ##################################################
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.browser }}
          path: test-results
          retention-days: 7
          if-no-files-found: warn